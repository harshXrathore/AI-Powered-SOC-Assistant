version: "3.9"

# ==============================================================================
# AI SOC Assistant — Docker Compose (Phase 1)
# ==============================================================================
# Services:
#   postgres   - primary relational store (alerts, users, reports, IOC cache)
#   redis      - cache + Celery broker/result backend
#   backend    - FastAPI application (API, AI orchestration, Wazuh polling)
#   celery-worker - async task runner (enrichment, report generation)
#   celery-beat   - scheduled tasks (periodic Wazuh polling, TI refresh)
#   frontend   - React/Vite SPA (served via Nginx in prod, Vite dev server in dev)
#   nginx      - reverse proxy / TLS termination / static asset serving
#
# Wazuh & Elastic Stack are treated as EXTERNAL services in Phase 1 — this repo
# connects to them via API rather than deploying the SIEM itself, since Wazuh
# is typically already running in the analyst's lab/enterprise environment.
# A docker/wazuh-connection.md doc explains how to point this stack at an
# existing Wazuh manager + indexer.
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: soc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-soc_assistant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soc_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soc_network

  redis:
    image: redis:7-alpine
    container_name: soc_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soc_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soc_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - soc_network

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soc_celery_worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    networks:
      - soc_network

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soc_celery_beat
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app
    command: celery -A app.core.celery_app beat --loglevel=info
    networks:
      - soc_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: soc_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000/ws}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - soc_network

  nginx:
    image: nginx:alpine
    container_name: soc_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    networks:
      - soc_network

volumes:
  postgres_data:
  redis_data:

networks:
  soc_network:
    driver: bridge
